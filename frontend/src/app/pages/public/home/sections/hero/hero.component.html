<section id="hero" class="hero">
  <div class="hero-bg">
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&h=900&fit=crop" alt="Castello di Lezha" class="hero-image">
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-content">
    <div class="hero-eyebrow">
      <span class="eyebrow-line"></span>
      <i class="fa-solid fa-ornament"></i>
      <span class="eyebrow-line"></span>
    </div>

    <h1 class="hero-title">
      <span class="title-word">Pualin</span>
      <span class="title-word">Zefi</span>
    </h1>

    <p class="hero-subtitle">{{ 'sections.hero.subtitle' | translate }}</p>

    <div class="hero-cta">
      <button class="btn btn-primary">
        <span>{{ 'sections.hero.discover_story' | translate }}</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <button class="btn btn-outline">
        <span>{{ 'sections.hero.publications' | translate }}</span>
      </button>
      <button class="btn btn-ghost">
        <span>{{ 'sections.hero.contacts' | translate }}</span>
      </button>
    </div>

    <div class="hero-scroll">
      <span class="scroll-text">{{ 'sections.hero.scroll' | translate }}</span>
      <div class="scroll-dot"></div>
    </div>
  </div>

  <button class="audio-toggle" aria-label="Toggle audio">
    <i class="fa-solid fa-volume-high"></i>
  </button>
</section>
